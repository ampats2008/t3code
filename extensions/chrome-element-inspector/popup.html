<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <style>
      body {
        width: 240px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        background: #1e1e2e;
        color: #cdd6f4;
        margin: 0;
      }
      .header {
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .logo {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
        font-size: 12px;
        color: #a6adc8;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f38ba8;
      }
      .status-dot.connected {
        background: #a6e3a1;
      }
      .btn {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #45475a;
        border-radius: 6px;
        background: #313244;
        color: #cdd6f4;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn:hover {
        background: #45475a;
      }
      .shortcut {
        font-size: 11px;
        color: #6c7086;
        margin-top: 8px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" rx="16" fill="#89b4fa"/>
        <text x="50" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="48" fill="#1e1e2e">AM</text>
      </svg>
      <span>t3code Inspector</span>
    </div>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Checking...</span>
    </div>
    <button class="btn" id="inspectBtn">Inspect Element</button>
    <div class="shortcut">Ctrl+Shift+X</div>
    <script src="dist/popup.js"></script>
  </body>
</html>
